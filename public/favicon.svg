<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular container background -->
  <rect width="64" height="64" rx="16" fill="#0F172A" />
  
  <!-- Left Side: Cool Snowflake / Chill Element in Cyan/Blue (#0284C7 / #38BDF8) -->
